<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mods Website</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    text-align: center;
  }

  .mods-button {
    background-color: #4CAF50;
    color: white;
    padding: 20px 40px;
    font-size: 1.5em;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
  }

  .mods-button:hover {
    background-color: #45a049;
    transform: scale(1.05);
    box-shadow: 0 12px 24px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
<div class="container">
  <button class="mods-button" onclick="redirectToMods()">Blooket Mods</button>
</div>

<script>
  function redirectToMods() {
    const url = 'https://github.com/Cicada-ES/S-Client/blob/main/S-Client.js';
    // Redirect the parent window if embedded, otherwise redirect itself
    if (window.top !== window.self) {
      window.top.location.href = url;
    } else {
      window.location.href = url;
    }
  }
</script>
</body>
</html>
